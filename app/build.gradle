plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = rootProject.file('.signing/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'uk.kmay.media'
    compileSdk 35
    defaultConfig { applicationId 'uk.kmay.media'; minSdk 23; targetSdk 35; versionCode 7; versionName '2.1.2'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { personal { if (signingFile.exists()) { storeFile file(signing.storeFile); storePassword signing.storePassword; keyAlias signing.keyAlias; keyPassword signing.keyPassword } } }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false; signingConfig signingConfigs.personal }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
